<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FleetComm cam</title>
<style>
  /* A popped-out helmet-cam feed: the SAME tile chrome as the wall — LIVE
     lamp, elapsed timer, callsign · name, fleet-clock stamp, VOX lamp, the
     field-feed scanlines — in its own always-on-top window. The opener owns
     the state and pushes it through window.camPop.set(); the video element
     plays the opener's MediaStream directly (same-origin child window). */
  @font-face{font-family:"IBM Plex Mono";src:url("fonts/plexmono-500.woff2") format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:"Atkinson Hyperlegible";src:url("fonts/atkinson-700.woff2") format("woff2");font-weight:700;font-display:swap}
  :root{--ink:#E7E0CD;--muted:#8f99a5;--grn:#5CA877;--tx:#CE7250;--amber:#CE7250;--line:#2A3743;--gold:#C9A96A;
    --grn-tint:rgba(92,168,119,.28);--tx-tint:rgba(206,114,80,.28);--mono:"IBM Plex Mono",Consolas,ui-monospace,monospace}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--mono);color:var(--ink);user-select:none}
  .tile{position:absolute;inset:0;border:2px solid var(--line);box-sizing:border-box;background:#000;overflow:hidden}
  .tile video{width:100%;height:100%;display:block;object-fit:contain;background:#000}
  .tile.talking{border-color:var(--grn);box-shadow:inset 0 0 0 1px var(--grn),inset 0 0 24px var(--grn-tint)}
  .tile.self.talking{border-color:var(--tx);box-shadow:inset 0 0 0 1px var(--tx),inset 0 0 24px var(--tx-tint)}
  .tl{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:6px 10px;z-index:2;
    background:linear-gradient(rgba(9,15,22,.88),rgba(9,15,22,.4) 70%,transparent);font-size:.64rem;letter-spacing:.14em;
    -webkit-app-region:drag;cursor:move}
  .tl .livebadge{display:inline-flex;align-items:center;gap:6px;color:var(--amber);border:1px solid var(--amber);padding:2px 7px;font-weight:600}
  .tl .livebadge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--amber);animation:lamp 1.2s ease-in-out infinite}
  @keyframes lamp{0%,100%{opacity:1}50%{opacity:.25}}
  .tl .tmr{font-family:"Atkinson Hyperlegible",var(--mono);font-size:.9rem;letter-spacing:.06em;font-variant-numeric:tabular-nums}
  .tl b{color:var(--grn);font-weight:600;white-space:nowrap}
  .tile.talking .tl b{color:var(--grn)} .tile.self.talking .tl b{color:var(--tx)}
  .tl .who{color:var(--muted);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
  .tl button{-webkit-app-region:no-drag;font-family:var(--mono);font-size:.64rem;letter-spacing:.1em;color:var(--ink);background:rgba(9,15,22,.6);
    border:1px solid var(--line);padding:3px 8px;cursor:pointer}
  .tl button:hover{color:var(--gold);border-color:var(--gold)}
  .bl{position:absolute;left:0;right:0;bottom:0;z-index:2;pointer-events:none;display:flex;justify-content:space-between;align-items:center;
    padding:5px 10px;font-size:.62rem;letter-spacing:.14em;color:var(--muted);background:linear-gradient(transparent,rgba(9,15,22,.78))}
  .bl .vox{opacity:0;transition:opacity .12s} .tile.talking .bl .vox{opacity:1;color:var(--grn)} .tile.self.talking .bl .vox{color:var(--tx)}
  [data-camscan] .tile::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.20) 0 1px, transparent 1px 3px)}
  [data-camscan] .tile::before{content:"";position:absolute;left:0;right:0;top:-32%;height:26%;z-index:1;pointer-events:none;opacity:.10;
    background:linear-gradient(rgba(231,224,205,0), rgba(231,224,205,.7), rgba(231,224,205,0));animation:camband 7s linear infinite}
  @keyframes camband{to{transform:translateY(520%)}}
  @media (prefers-reduced-motion:reduce){[data-camscan] .tile::before{animation:none;opacity:0}}
  @container (max-width:430px){ .tl .who{display:none} .tl .tmr{font-size:.76rem} }
  @container (max-width:330px){ .bl [data-fclock]{display:none} }
  body{container-type:inline-size}
</style>
</head>
<body>
<div class="tile" id="tile">
  <video id="v" autoplay muted playsinline></video>
  <div class="tl"><span class="livebadge">LIVE</span><span class="tmr" id="tmr">--:--:--</span><b id="cs"></b><span class="who" id="who"></span>
    <button id="close" title="Close this pop-out">✕</button></div>
  <div class="bl"><span data-fclock id="clk"></span><span class="vox">● VOX</span></div>
</div>
<script>
  /* the opener drives everything; this is the only script the page owns */
  window.camPop = {
    set: function (s) {
      var t = document.getElementById("tile");
      document.getElementById("cs").textContent = s.cs || "";
      document.getElementById("who").textContent = s.who || "";
      document.getElementById("tmr").textContent = s.timer || "--:--:--";
      document.getElementById("clk").textContent = s.clock || "";
      t.classList.toggle("talking", !!s.talking);
      t.classList.toggle("self", !!s.self);
      if (s.scan) document.documentElement.setAttribute("data-camscan", ""); else document.documentElement.removeAttribute("data-camscan");
      document.title = "FleetComm cam — " + (s.cs || "");
    }
  };
  document.getElementById("close").addEventListener("click", function () { window.close(); });
</script>
</body>
</html>
