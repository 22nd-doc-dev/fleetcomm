<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
  :root{
    --panelRGB:13,18,23; --holoRGB:73,209,124;
    --panel:rgba(var(--panelRGB),var(--bgA,.72));
    --ink:#e8edf1; --muted:#8b979f; --holo:#49d17c; --tx:#ffb648; --off:#222a31;
  }
  body.light{
    --panelRGB:236,242,247; --holoRGB:12,138,166;
    --ink:#152232; --muted:#5b6e80; --holo:#0c8aa6; --off:#c8d4de;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;overflow:hidden;height:100%}
  @font-face{font-family:"Atkinson Hyperlegible";src:url("fonts/atkinson-400.woff2") format("woff2");
    font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"Atkinson Hyperlegible";src:url("fonts/atkinson-700.woff2") format("woff2");
    font-weight:700;font-style:normal;font-display:swap}
  /* the overlay sits over the game, where legibility matters most */
  body{font:13px/1.4 "Atkinson Hyperlegible",-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
    display:flex;flex-direction:column;justify-content:flex-start}
  #box{transform-origin:top left;padding:6px}
  .row{display:flex;align-items:center;gap:7px;background:var(--panel);
    border:1px solid rgba(var(--holoRGB),.18);border-radius:8px;padding:5px 9px;margin-bottom:4px;
    transition:border-color .1s;backdrop-filter:blur(2px)}
  .row.rx{border-color:var(--holo);box-shadow:0 0 8px rgba(var(--holoRGB),.35)}
  .row.tx{border-color:var(--tx);box-shadow:0 0 8px rgba(251,146,60,.4)}
  .row.inactive-muted{opacity:.5}
  .lamp{width:8px;height:8px;border-radius:50%;background:var(--off);flex:0 0 auto}
  .rx .lamp{background:var(--holo);box-shadow:0 0 6px var(--holo)}
  .tx .lamp{background:var(--tx);box-shadow:0 0 6px var(--tx)}
  .nm{font-weight:800;letter-spacing:.4px;white-space:nowrap}
  .nm small{color:var(--muted);font-weight:600;margin-left:5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px}
  .act{color:var(--holo);font-size:10.5px;font-weight:900;letter-spacing:1px;display:none}
  .row.active .act{display:inline}
  .who{margin-left:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:12px;
    color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .rx .who{color:var(--holo)} .tx .who{color:var(--tx)}
  /* edit chrome */
  #edit{display:none;background:rgba(var(--panelRGB),.92);border:1px dashed var(--holo);border-radius:8px;
    padding:8px 10px;margin:0 0 4px;-webkit-app-region:drag}
  body.editing #edit{display:block}
  body.editing{outline:2px dashed var(--holo);outline-offset:-2px}
  #edit .t{font-weight:800;font-size:12px;letter-spacing:1px;margin-bottom:6px}
  #edit .ctl{display:flex;align-items:center;gap:6px;margin:4px 0;-webkit-app-region:no-drag}
  #edit label{font-size:11.5px;font-weight:800;color:var(--muted);width:44px}
  #edit input[type=range]{flex:1;accent-color:var(--holo)}
  #edit button{-webkit-app-region:no-drag;background:var(--holo);border:none;border-radius:6px;
    padding:5px 12px;font-weight:800;font-size:12px;cursor:pointer;color:#08222c;width:100%;margin-top:4px}
  #empty{color:var(--muted);font-size:12px;padding:6px;background:var(--panel);border-radius:8px;display:none}
</style>
</head>
<body>
<div id="box">
  <div id="edit">
    <div class="t">OVERLAY · drag here to move · edges to resize</div>
    <div class="ctl"><label>OPACITY</label><input type="range" id="op" min="15" max="100" value="72"></div>
    <div class="ctl"><label>SCALE</label><input type="range" id="sc" min="70" max="180" value="100"></div>
    <button id="lock">LOCK ▸ back to click-through</button>
  </div>
  <div id="empty">FleetComm overlay — connect to see nets</div>
  <div id="rows"></div>
</div>
<script src="overlay.js"></script>
</body>
</html>
