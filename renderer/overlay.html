<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
  /* ══ Night-watch overlay — hairlines and bone text over the game.
     Legibility outranks the aesthetic here: names stay in Atkinson
     Hyperlegible, glows are gone but state still reads in one glance
     (left rule + lamp + tinted name). Square corners, no chrome. ══ */
  :root{
    --panelRGB:9,15,22; --holoRGB:92,168,119;
    --panel:rgba(var(--panelRGB),var(--bgA,.72));
    --ink:#E7E0CD; --muted:#8f99a5; --holo:#5CA877; --tx:#CE7250; --gold:#C9A96A; --off:#26303B;
  }
  body.light{
    --panelRGB:242,237,224; --holoRGB:46,123,79;
    --ink:#16222C; --muted:#5d6a75; --holo:#2E7B4F; --tx:#A8472B; --gold:#A5813C; --off:#c9c2b0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent;overflow:hidden;height:100%}
  @font-face{font-family:"Atkinson Hyperlegible";src:url("fonts/atkinson-400.woff2") format("woff2");
    font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"Atkinson Hyperlegible";src:url("fonts/atkinson-700.woff2") format("woff2");
    font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:"IBM Plex Mono";src:url("fonts/plexmono-500.woff2") format("woff2");
    font-weight:500;font-style:normal;font-display:swap}
  /* the overlay sits over the game, where legibility matters most */
  body{font:13px/1.4 "Atkinson Hyperlegible",-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);
    display:flex;flex-direction:column;justify-content:flex-start}
  #box{transform-origin:top left;padding:6px}
  .row{display:flex;align-items:center;gap:7px;background:var(--panel);
    border:1px solid rgba(var(--holoRGB),.16);border-left:2px solid transparent;
    padding:5px 9px;margin-bottom:4px;
    transition:border-color .1s;backdrop-filter:blur(2px)}
  .row.rx{border-color:var(--holo);border-left-color:var(--holo)}
  .row.tx{border-color:var(--tx);border-left-color:var(--tx)}
  .row.inactive-muted{opacity:.5}
  .lamp{width:7px;height:7px;border-radius:50%;background:var(--off);flex:0 0 auto}
  .rx .lamp{background:var(--holo)}
  .tx .lamp{background:var(--tx)}
  .nm{font-weight:700;letter-spacing:.4px;white-space:nowrap}
  .nm small{color:var(--gold);font-weight:500;margin-left:6px;
    font-family:"IBM Plex Mono",Consolas,ui-monospace,monospace;font-size:10.5px;letter-spacing:.08em}
  .act{color:var(--gold);font-size:10.5px;font-weight:700;letter-spacing:1px;display:none}
  .row.active .act{display:inline}
  .who{margin-left:auto;font-family:"IBM Plex Mono",Consolas,ui-monospace,monospace;font-weight:500;font-size:11.5px;
    color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
  .rx .who{color:var(--holo)} .tx .who{color:var(--tx)}
  /* edit chrome */
  #edit{display:none;background:rgba(var(--panelRGB),.92);border:1px dashed var(--gold);
    padding:8px 10px;margin:0 0 4px;-webkit-app-region:drag}
  body.editing #edit{display:block}
  body.editing{outline:2px dashed var(--gold);outline-offset:-2px}
  #edit .t{font-family:"IBM Plex Mono",Consolas,ui-monospace,monospace;font-weight:500;font-size:10.5px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
  #edit .ctl{display:flex;align-items:center;gap:6px;margin:4px 0;-webkit-app-region:no-drag}
  #edit label{font-family:"IBM Plex Mono",Consolas,ui-monospace,monospace;font-size:10.5px;
    font-weight:500;letter-spacing:.08em;color:var(--muted);width:52px}
  #edit input[type=range]{flex:1;accent-color:var(--gold)}
  #edit button{-webkit-app-region:no-drag;background:var(--gold);border:none;
    font-family:"IBM Plex Mono",Consolas,ui-monospace,monospace;letter-spacing:.1em;
    padding:6px 12px;font-weight:600;font-size:11px;cursor:pointer;color:#16222C;width:100%;margin-top:4px}
  #empty{color:var(--muted);font-size:12px;padding:6px;background:var(--panel);display:none}
</style>
</head>
<body>
<div id="box">
  <div id="edit">
    <div class="t">OVERLAY · drag here to move · edges to resize</div>
    <div class="ctl"><label>OPACITY</label><input type="range" id="op" min="15" max="100" value="72"></div>
    <div class="ctl"><label>SCALE</label><input type="range" id="sc" min="70" max="180" value="100"></div>
    <button id="lock">LOCK ▸ back to click-through</button>
  </div>
  <div id="empty">FleetComm overlay — connect to see nets</div>
  <div id="rows"></div>
</div>
<script src="overlay.js"></script>
</body>
</html>
