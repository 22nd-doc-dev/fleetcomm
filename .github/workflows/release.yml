name: Build & Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mumble-server
      - run: sudo systemctl stop mumble-server || true
      - run: bash test/run-relay-tests.sh
  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
          fail_on_unmatched_files: true
  mac:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx electron-builder --mac zip --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
          fail_on_unmatched_files: true
  linux:
    # EXPERIMENTAL — an AppImage for the Linux operators (Sven). Not wired to
    # the auto-updater (that path is Windows-only); a hand download from the
    # release page. Built on the same runner that already runs verify.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx electron-builder --linux AppImage --x64 --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
          fail_on_unmatched_files: true
