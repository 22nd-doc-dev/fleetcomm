name: Build & Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mumble-server
      - run: sudo systemctl stop mumble-server || true
      - run: bash test/run-relay-tests.sh
  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - name: Compatibility copy under the pre-1.3.8 artifact name (fielded updaters download FleetComm-<v>.exe)
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          Copy-Item "dist/FleetComm-$v-windows.exe" "dist/FleetComm-$v.exe"
          Get-ChildItem dist/*.exe | Format-Table Name, Length
      - uses: softprops/action-gh-release@v2
        with:
          name: FleetComm ${{ github.ref_name }}
          body: |
            **Which file is for you**
            - **Windows** — `FleetComm-<version>-windows.exe` (portable; no install; updates itself). The unlabeled `FleetComm-<version>.exe` is the same file under the name older builds look for — either works.
            - **macOS** — `FleetComm-<version>-macos.zip` (unzip, drag to Applications).
            - **Linux (experimental)** — `FleetComm-<version>-linux-x64.AppImage` (`chmod +x`, run) or `FleetComm-<version>-linux-x64.flatpak` (`flatpak install --user`). Linux does not auto-update yet.
          files: |
            dist/*.exe
          fail_on_unmatched_files: true
  mac:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx electron-builder --mac zip --publish never
      - uses: softprops/action-gh-release@v2
        with:
          name: FleetComm ${{ github.ref_name }}
          body: |
            **Which file is for you**
            - **Windows** — `FleetComm-<version>-windows.exe` (portable; no install; updates itself). The unlabeled `FleetComm-<version>.exe` is the same file under the name older builds look for — either works.
            - **macOS** — `FleetComm-<version>-macos.zip` (unzip, drag to Applications).
            - **Linux (experimental)** — `FleetComm-<version>-linux-x64.AppImage` (`chmod +x`, run) or `FleetComm-<version>-linux-x64.flatpak` (`flatpak install --user`). Linux does not auto-update yet.
          files: |
            dist/*.zip
          fail_on_unmatched_files: true
  linux:
    # EXPERIMENTAL — an AppImage for the Linux operators (Sven). Not wired to
    # the auto-updater (that path is Windows-only); a hand download from the
    # release page. Built on the same runner that already runs verify.
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Flatpak toolchain + runtimes (system-wide, so flatpak-builder finds them)
        run: |
          sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq flatpak flatpak-builder imagemagick
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08
      - run: npx electron-builder --linux AppImage --x64 --publish never
      - run: bash scripts/repack-appimage.sh
      - run: bash scripts/build-flatpak.sh
      - uses: softprops/action-gh-release@v2
        with:
          name: FleetComm ${{ github.ref_name }}
          body: |
            **Which file is for you**
            - **Windows** — `FleetComm-<version>-windows.exe` (portable; no install; updates itself). The unlabeled `FleetComm-<version>.exe` is the same file under the name older builds look for — either works.
            - **macOS** — `FleetComm-<version>-macos.zip` (unzip, drag to Applications).
            - **Linux (experimental)** — `FleetComm-<version>-linux-x64.AppImage` (`chmod +x`, run) or `FleetComm-<version>-linux-x64.flatpak` (`flatpak install --user`). Linux does not auto-update yet.
          files: |
            dist/*.AppImage
            dist/*.flatpak
          fail_on_unmatched_files: true
