name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write   # needed by the temporary on-failure debug-log publish
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run verify
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq mumble-server
      - run: sudo systemctl stop mumble-server || true
      - name: relay suites
        shell: bash
        run: set -o pipefail; bash test/run-relay-tests.sh 2>&1 | tee relay-out.log
      # TEMPORARY DIAGNOSTIC: publish a failing relay run's output to an
      # anonymously-readable branch (job logs need repo-admin auth). Remove
      # once the flake is caught and fixed.
      - name: publish failure log
        if: failure()
        run: |
          d=$(mktemp -d)
          cp relay-out.log "$d"/ 2>/dev/null || echo "no relay-out.log produced" > "$d"/relay-out.log
          cd "$d"
          git init -q .
          git checkout -qb ci-debug-log
          git add relay-out.log
          git -c user.email=ci@fleetcomm -c user.name=ci-debug commit -qm "relay failure log $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-debug-log
