name: Linux build (proof)
# Pushing a branch named linux-build builds the AppImage without cutting a
# release — the way to prove the Linux target before a tag (a failed tag is
# a re-tag under the same version, per the release rules).
on:
  push:
    branches: ['linux-build']
permissions:
  contents: write   # the smoke logs are force-pushed to ci-debug-log (job logs need admin auth to read)
jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Flatpak toolchain + runtimes (system-wide, so flatpak-builder finds them)
        run: |
          sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08
      - run: npx electron-builder --linux AppImage flatpak --x64 --publish never
      - run: bash scripts/repack-appimage.sh
      - run: ls -la dist/ && file dist/*.AppImage dist/*.flatpak
      - name: Linux smoke - run both artifacts headless with the autotest rig
        run: |
          set -uo pipefail
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq xvfb dbus-x11 >/dev/null
          mkdir -p /tmp/smoke
          node test/fake-murmur.js > /tmp/smoke/fake-murmur.log 2>&1 &
          sleep 2
          chmod +x dist/FleetComm-*.AppImage
          echo "== AppImage"
          (FLEETCOMM_AUTOTEST=127.0.0.1 timeout 75 xvfb-run -a ./dist/FleetComm-*.AppImage --no-sandbox --enable-logging > /tmp/smoke/appimage.log 2>&1 || true)
          echo "== Flatpak install"
          flatpak install --user -y --noninteractive ./dist/FleetComm-*.flatpak > /tmp/smoke/flatpak-install.log 2>&1 || true
          tail -n 5 /tmp/smoke/flatpak-install.log
          flatpak list --user --columns=application,version,branch,runtime > /tmp/smoke/flatpak-list.log 2>&1 || true
          cat /tmp/smoke/flatpak-list.log
          echo "== Flatpak: sandbox layout + stdout capture check"
          (flatpak run --command=sh space.fleetcomm.app -c 'echo hello-from-sandbox; echo "TMPDIR=$TMPDIR XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR DISPLAY=$DISPLAY"; ls -la /app/bin; echo ---; cat /app/bin/electron-wrapper; echo ---; ls /app/lib/space.fleetcomm.app | head -30; echo ---; ldd /app/lib/space.fleetcomm.app/fleetcomm | grep -i "not found" || echo "ldd: all libs resolved"; ls /app/lib/space.fleetcomm.app/resources; find /app/lib/space.fleetcomm.app -name "*.node" | head' > /tmp/smoke/flatpak-layout.log 2>&1 || true)
          cat /tmp/smoke/flatpak-layout.log
          echo "== Flatpak run (zypak, verbose)"
          (timeout 60 dbus-run-session -- xvfb-run -a flatpak run --env=FLEETCOMM_AUTOTEST=127.0.0.1 --env=ELECTRON_ENABLE_LOGGING=1 --env=ELECTRON_ENABLE_STACK_DUMPING=1 --env=ZYPAK_DEBUG=1 space.fleetcomm.app --enable-logging=stderr --v=0 > /tmp/smoke/flatpak.log 2>&1 || true)
          echo "== Flatpak run (zypak, mimic strategy: ZYPAK_ZYGOTE_STRATEGY_SPAWN=0)"
          (timeout 60 dbus-run-session -- xvfb-run -a flatpak run --env=FLEETCOMM_AUTOTEST=127.0.0.1 --env=ELECTRON_ENABLE_LOGGING=1 --env=ZYPAK_ZYGOTE_STRATEGY_SPAWN=0 space.fleetcomm.app --enable-logging=stderr > /tmp/smoke/flatpak-mimic.log 2>&1 || true)
          echo "== Flatpak run (zypak wrapper + --no-sandbox)"
          (timeout 60 dbus-run-session -- xvfb-run -a flatpak run --env=FLEETCOMM_AUTOTEST=127.0.0.1 --env=ELECTRON_ENABLE_LOGGING=1 space.fleetcomm.app --no-sandbox --enable-logging=stderr > /tmp/smoke/flatpak-nosandbox.log 2>&1 || true)
          echo "== Flatpak run (binary direct, no zypak, --no-sandbox)"
          (timeout 60 dbus-run-session -- xvfb-run -a flatpak run --command=/app/lib/space.fleetcomm.app/fleetcomm --env=FLEETCOMM_AUTOTEST=127.0.0.1 --env=ELECTRON_ENABLE_LOGGING=1 space.fleetcomm.app --no-sandbox --enable-logging=stderr > /tmp/smoke/flatpak-direct.log 2>&1 || true)
          echo "== sandbox tmp/userData after runs"
          (ls -laR "$XDG_RUNTIME_DIR/app/space.fleetcomm.app" 2>/dev/null | head -40; ls -laR ~/.var/app/space.fleetcomm.app 2>/dev/null | head -40) > /tmp/smoke/flatpak-dirs.log || true
          for f in flatpak flatpak-mimic flatpak-nosandbox flatpak-direct; do echo "== $f: autotest lines $(grep -c '\[AUTOTEST\]' /tmp/smoke/$f.log || true) / main lines $(grep -c '\[fleetcomm\]' /tmp/smoke/$f.log || true)"; done
          for f in appimage flatpak; do echo "== $f: autotest lines $(grep -c '\[AUTOTEST\]' /tmp/smoke/$f.log || true) / console errors $(grep -c 'ERROR:CONSOLE' /tmp/smoke/$f.log || true)"; done
          echo "== flatpak.log tail"; tail -n 60 /tmp/smoke/flatpak.log || true
      - name: Publish smoke logs to the ci-debug-log branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/pub && mkdir -p /tmp/pub && cp /tmp/smoke/*.log /tmp/pub/ 2>/dev/null || true
          cd /tmp/pub && git init -q && git config user.name ci && git config user.email ci@fleetcomm.local
          git add . && git commit -qm "linux smoke logs for $GITHUB_SHA" && git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-debug-log
      - uses: actions/upload-artifact@v4
        with:
          name: fleetcomm-appimage
          path: |
            dist/*.AppImage
            dist/*.flatpak
